# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.x.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  deploy:
    runs-on: self-hosted

    steps:
      - name: Test self-hosted agent on Raspberry
        run: echo "🐧 This job is now running on a ${{ runner.os }} {{runner.name}} {{runner.arch}}"

      - name: Inspect runner context
        run: |
          echo "🐧 Running on ${{ runner.name }} (${{ runner.os }} / ${{ runner.arch }})"
          echo "Environment: ${{ runner.environment }}"
          echo "Temp folder: ${{ runner.temp }}"
          echo "Full JSON dump:"
          echo '${{ toJSON(runner) }}'
